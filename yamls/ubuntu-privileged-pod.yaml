apiVersion: v1
kind: Pod
metadata:
  name: ubuntu-privileged-test
  namespace: default
  labels:
    app: ubuntu-privileged
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: test
      image: registry-sg.inshopline.com/yy_default/ubuntu_16.04:latest
      imagePullPolicy: IfNotPresent
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
        capabilities:
          add:
            - SYS_ADMIN
      # 使用 /bin/sh 并保持容器常驻，方便后续 kubectl exec 进入交互
      command: ["/bin/sh"]
      args: ["-c", "sleep infinity"]
      tty: true
      stdin: true
      resources: {}