unauthorized_user:
  url_map:
  - src_paths:
    - "/container/.*"
    drop_src_path_prefix_parts: 1
    url_prefix: "http://victoria-metrics-cluster-container-vmselect.monitor.svc.kubeyy.com.:8481/"
  - src_paths:
    - "/host/.*"
    drop_src_path_prefix_parts: 1
    url_prefix: "http://victoria-metrics-cluster-host-vmselect.monitor.svc.kubeyy.com.:8481/"
  discover_backend_ips: true
  load_balancing_policy: least_loaded
  retry_status_codes:
  - 500
  - 502
users:
- name: vmagent
  bearer_token: HgLy2n2M8hLhMdTw
  discover_backend_ips: true
  retry_status_codes:
  - 500
  - 502
  headers:
  - 'X-Scope-OrgID: vmagent'
  url_map:
  - src_paths: ["/container/insert/.*"]
    url_prefix: http://victoria-metrics-cluster-container-vminsert.monitor.svc.kubeyy.com.:8480/
    drop_src_path_prefix_parts: 1
  - src_paths: ["/container/select/.*"]
    url_prefix: http://victoria-metrics-cluster-container-vmselect.monitor.svc.kubeyy.com.:8480/
    drop_src_path_prefix_parts: 1
  - src_paths: ["/host/insert/.*"]
    url_prefix: http://victoria-metrics-cluster-host-vminsert.monitor.svc.kubeyy.com.:8480/
    drop_src_path_prefix_parts: 1
  - src_paths: ["/host/select/.*"]
    url_prefix: http://victoria-metrics-cluster-host-vmselect.monitor.svc.kubeyy.com.:8480/
    drop_src_path_prefix_parts: 1

