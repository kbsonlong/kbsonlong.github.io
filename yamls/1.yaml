unauthorized_user:
  url_map:
  - src_paths:
    - "/container/.*"
    drop_src_path_prefix_parts: 1
    url_prefix: "http://victoria-metrics-cluster-container-vmselect.monitor.svc.kubeyy.com.:8481/"
  - src_paths:
    - "/host/.*"
    drop_src_path_prefix_parts: 1
    url_prefix: "http://victoria-metrics-cluster-host-vmselect.monitor.svc.kubeyy.com.:8481/"
  discover_backend_ips: true
  load_balancing_policy: least_loaded
  retry_status_codes:
  - 500
  - 502
