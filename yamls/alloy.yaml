apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: alloy
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      annotations:
        prometheus.vm/port: "12345"
        prometheus.vm/scrape: "true"
      creationTimestamp: null
      labels:
        app: alloy
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: not.deploy.alloy
                operator: NotIn
                values:
                - "true"
      containers:
      - args:
        - --watched-dir=/etc/alloy
        - --reload-url=http://localhost:12345/-/reload
        image: registry.cn-hangzhou.aliyuncs.com/seam/config-reloader:v0.81.0
        imagePullPolicy: IfNotPresent
        name: config-reloader
        resources:
          requests:
            cpu: 10m
            memory: 50Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/alloy
          name: config
      - args:
        - run
        - --server.http.listen-addr=0.0.0.0:12345
        - --server.http.ui-path-prefix=/
        - --stability.level=generally-available
        - --cluster.enabled=true
        - --cluster.join-addresses=alloy.monitoring.svc.kubeyy.com.
        - /etc/alloy/alloy.yaml
        image: registry.cn-hangzhou.aliyuncs.com/seam/alloy:v1.9.2
        imagePullPolicy: IfNotPresent
        name: alloy
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: 50m
            memory: 100Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/alloy
          name: config
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: alloy
      serviceAccountName: alloy
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: alloy-config
        name: config
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate

---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: alloy
    app.kubernetes.io/name: alloy
  name: alloy
  namespace: alloy
spec:
  clusterIP: None
  clusterIPs:
  - None
  ports:
  - name: http
    port: 12345
    protocol: TCP
    targetPort: 12345
  selector:
    app: alloy
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: v1
data:
  alloy.yaml: |
    discovery.kubernetes "pods" {
      role = "pod"

      selectors {
        role  = "pod"
        label = "project-name"
      }
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets
      rule  {
        source_labels = ["__meta_kubernetes_pod_label_project_name"]
        target_label  = "project_name"
      }
      rule  {
        source_labels = ["__meta_kubernetes_pod_label_deploy_type"]
        target_label  = "deploy_type"
      }
      rule  {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule  {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule  {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [otelcol.receiver.loki.default.receiver]
      clustering {
        enabled = true
      }
    }

    otelcol.receiver.loki "default" {
      output {
        logs = [otelcol.processor.batch.default.input]
      }
    }

    otelcol.processor.batch "default" {
      send_batch_size     = 1024
      send_batch_max_size = 2048
      timeout             = "5s"

      output {
        logs = [otelcol.exporter.otlphttp.default.input]
      }
    }

    otelcol.exporter.otlphttp "default" {
      client {
        endpoint    = "{{.VlogEndpoint}}"
        timeout     = "30s"
        compression = "gzip"
        headers     = {
          "content-type"     = "application/x-protobuf",
          "VL-Extra-Fields"  = "cluster={{.ClusterName}}",
          "VL-Stream-Fields" = "cluster,project_name",
          "VL-Ignore-Fields" = "loki.attribute.labels,job,instance",
        }
      }
    }
kind: ConfigMap
metadata:
  labels:
    app: alloy
  name: alloy-config
  namespace: alloy
---

