apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: {{.namespace}}
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      annotations:
        prometheus.vm/port: "12345"
        prometheus.vm/scrape: "true"
      labels:
        app: alloy
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: not.deploy.alloy
                operator: NotIn
                values:
                - "true"
      containers:
      - args:
        - --watched-dir=/etc/alloy
        - --reload-url=http://localhost:12345/-/reload
        image: registry.cn-hangzhou.aliyuncs.com/seam/config-reloader:v0.81.0
        name: config-reloader
        resources:
          requests:
            cpu: 10m
            memory: 50Mi
        volumeMounts:
        - mountPath: /etc/alloy
          name: config
      - args:
        - run
        - --server.http.listen-addr=0.0.0.0:12345
        - --server.http.ui-path-prefix=/
        - --stability.level=generally-available
        - --cluster.enabled=true
        - --cluster.join-addresses=alloy.monitoring.svc.kubeyy.com.
        - /etc/alloy/alloy.yaml
        image: registry.cn-hangzhou.aliyuncs.com/seam/alloy:v1.9.2
        name: alloy
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: 50m
            memory: 100Mi
        volumeMounts:
        - mountPath: /etc/alloy
          name: config
        - mountPath: /var/log
          name: varlog
        - mountPath: /var/lib/docker/containers
          name: varlibdockercontainers
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: alloy-config
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: {{.namespace}}
data:
  alloy.yaml: |
    discovery.kubelet "pods" {
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = false
      }
    }
    discovery.relabel "pod_logs" {
      targets = discovery.kubelet.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        regex = sys.env("NODE_NAME")
        action = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_project_name"]
        target_label = "project_name"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_deploy_type"]
        target_label = "deploy_type"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label = "container"
      }
    }

    loki.source.kubernetes "pods" {
      targets = discovery.relabel.pod_logs.output
      forward_to = [otelcol.receiver.loki.default.receiver]
      clustering {
        enabled = true
      }
    }

    otelcol.receiver.loki "default" {
      output {
        logs = [otelcol.processor.batch.default.input]
      }
    }

    otelcol.processor.batch "default" {
      send_batch_size     = 1024
      send_batch_max_size = 2048
      timeout             = "5s"

      output {
        logs = [otelcol.exporter.otlphttp.default.input]
      }
    }

    otelcol.exporter.otlphttp "default" {
      client {
        endpoint    = "{{.VlogEndpoint}}"
        timeout     = "30s"
        compression = "gzip"
        headers     = {
          "content-type"     = "application/x-protobuf",
          "VL-Extra-Fields"  = "cluster={{.ClusterName}}",
          "VL-Stream-Fields" = "cluster,project_name",
          "VL-Ignore-Fields" = "loki.attribute.labels,job,instance",
        }
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: {{.namespace}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
rules:
- apiGroups: [""]
  resources: 
  - nodes
  - nodes/proxy
  - nodes/metrics
  verbs: ["get"]
- nonResourceURLs: 
  - /metrics
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy
subjects:
- kind: ServiceAccount
  name: alloy
  namespace: {{.namespace}}