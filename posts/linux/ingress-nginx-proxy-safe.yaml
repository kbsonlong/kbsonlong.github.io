---
# 安全的 Ingress Nginx 代理配置
# 避免使用 configuration-snippet，使用标准注解

# 1. Docker Hub 的 ExternalName Service
apiVersion: v1
kind: Service
metadata:
  name: docker-hub-registry
  namespace: default
  labels:
    app: registry-proxy
    registry: docker-hub
spec:
  type: ExternalName
  externalName: registry.cn-hangzhou.aliyuncs.com
---

# 2. 安全的 Docker Hub 代理 Ingress 配置
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docker-hub-proxy-safe
  namespace: default
  annotations:
    # 基本代理配置 - 这些是安全的标准注解
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    
    # 缓冲区配置
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-max-temp-file-size: "1024m"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    
    # 连接池优化
    nginx.ingress.kubernetes.io/upstream-keepalive-connections: "320"
    nginx.ingress.kubernetes.io/upstream-keepalive-requests: "10000"
    nginx.ingress.kubernetes.io/upstream-keepalive-timeout: "60"
    
    # 重试配置
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout invalid_header http_500 http_502 http_503 http_504"
    nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
    
    # 自定义头配置（安全的）
    nginx.ingress.kubernetes.io/custom-headers: "default/custom-headers"
    
    # 如果使用 cert-manager 自动管理证书
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
spec:
  ingressClassName: nginx
  rules:
  - host: dockerhub.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: docker-hub-registry
            port:
              number: 443
  tls:
  - hosts:
    - dockerhub.yourdomain.com
    secretName: dockerhub-tls-secret-bmkkn
---

# 3. 自定义头配置 ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-headers
  namespace: default
data:
  # Docker Registry 特定的头
  Docker-Distribution-Api-Version: "registry/2.0"
  # 安全头
  X-Content-Type-Options: "nosniff"
  X-Frame-Options: "DENY"
  X-XSS-Protection: "1; mode=block"
---

# 4. GCR 代理 Ingress 配置（安全版本）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gcr-proxy-safe
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    # 使用 proxy-set-headers 而不是 configuration-snippet
    nginx.ingress.kubernetes.io/proxy-set-headers: "default/proxy-set-headers-gcr"
    
spec:
  ingressClassName: nginx
  rules:
  - host: gcr.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gcr-registry
            port:
              number: 443
  tls:
  - hosts:
    - gcr.yourdomain.com
    secretName: gcr-tls-secret
---

# 5. GCR 代理头配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-set-headers-gcr
  namespace: default
data:
  Authorization: ""  # 清空认证头
  Host: "gcr.io"     # 设置正确的 Host 头
---

# 6. Quay.io 代理 Ingress 配置（安全版本）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quay-proxy-safe
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    # 使用 proxy-set-headers 而不是 configuration-snippet
    nginx.ingress.kubernetes.io/proxy-set-headers: "default/proxy-set-headers-quay"
    
spec:
  ingressClassName: nginx
  rules:
  - host: quay.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: quay-registry
            port:
              number: 443
  tls:
  - hosts:
    - quay.yourdomain.com
    secretName: quay-tls-secret
---

# 7. Quay.io 代理头配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-set-headers-quay
  namespace: default
data:
  Host: "quay.io"  # 设置正确的 Host 头