---
# 安全的Ingress Nginx代理配置 - 避免安全风险
apiVersion: v1
kind: Service
metadata:
  name: docker-hub-registry
  namespace: default
spec:
  type: ExternalName
  externalName: registry.cn-hangzhou.aliyuncs.com
---
apiVersion: v1
kind: Service
metadata:
  name: gcr-registry
  namespace: default
spec:
  type: ExternalName
  externalName: gcr.io
---
apiVersion: v1
kind: Service
metadata:
  name: quay-registry
  namespace: default
spec:
  type: ExternalName
  externalName: quay.io
---
# Docker Hub 代理 Ingress (安全版本)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docker-hub-proxy-secure
  namespace: default
  annotations:
    # 使用安全的注解替代 configuration-snippet
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    
    # 使用 ConfigMap 设置代理头，避免使用 configuration-snippet
    nginx.ingress.kubernetes.io/proxy-set-headers: "default/docker-hub-headers"
    
    # 缓冲区配置
    nginx.ingress.kubernetes.io/proxy-buffer-size: "32k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-max-temp-file-size: "1024m"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    
    # 连接池优化
    nginx.ingress.kubernetes.io/upstream-keepalive-connections: "32"
    nginx.ingress.kubernetes.io/upstream-keepalive-requests: "100"
    nginx.ingress.kubernetes.io/upstream-keepalive-timeout: "60"
    
    # 禁用SSL重定向 (用于HTTP测试)
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    
spec:
  ingressClassName: nginx
  rules:
  - host: dockerhub-secure.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: docker-hub-registry
            port:
              number: 443
---
# GCR 代理 Ingress (安全版本)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gcr-proxy-secure
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-set-headers: "default/gcr-headers"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    
spec:
  ingressClassName: nginx
  rules:
  - host: gcr-secure.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gcr-registry
            port:
              number: 443
---
# Quay.io 代理 Ingress (安全版本)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quay-proxy-secure
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-set-headers: "default/quay-headers"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    
spec:
  ingressClassName: nginx
  rules:
  - host: quay-secure.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: quay-registry
            port:
              number: 443
---
# 代理头配置 ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: docker-hub-headers
  namespace: default
data:
  Host: "registry.cn-hangzhou.aliyuncs.com"
  Docker-Distribution-Api-Version: "registry/2.0"
  User-Agent: "Docker-Client/20.10.0 (linux)"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gcr-headers
  namespace: default
data:
  Host: "gcr.io"
  Docker-Distribution-Api-Version: "registry/2.0"
  User-Agent: "Docker-Client/20.10.0 (linux)"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quay-headers
  namespace: default
data:
  Host: "quay.io"
  Docker-Distribution-Api-Version: "registry/2.0"
  User-Agent: "Docker-Client/20.10.0 (linux)"
---
# 替代方案：使用全局 ConfigMap 配置 DNS 解析
# 创建这个 ConfigMap 来配置 Nginx 控制器的全局 DNS 设置
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-configuration
  namespace: ingress-nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
data:
  # 全局 DNS 解析器配置
  resolver-address: "kube-dns.kube-system.svc.cluster.local"
  resolver-valid: "30s"
  resolver-ipv6: "false"
  # 其他全局配置
  proxy-body-size: "0"
  proxy-read-timeout: "600"
  proxy-send-timeout: "600"
  proxy-connect-timeout: "600"