# 7. Docker Hub 代理头配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: docker-hub-headers
  namespace: default
data:
  Host: "registry.cn-hangzhou.aliyuncs.com"
  Docker-Distribution-Api-Version: "registry/2.0"
  Authorization: ""
  User-Agent: "Docker-Client/20.10.0 (linux)"
---

# 8. GCR 代理头配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: gcr-headers
  namespace: default
data:
  Host: "gcr.io"
  Docker-Distribution-Api-Version: "registry/2.0"
  Authorization: ""
  User-Agent: "Docker-Client/20.10.0 (linux)"
---

# 9. Quay.io 代理头配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: quay-headers
  namespace: default
data:
  Host: "quay.io"
  Docker-Distribution-Api-Version: "registry/2.0"
  Authorization: ""
  User-Agent: "Docker-Client/20.10.0 (linux)"
---

# 10. Docker Hub 代理 Ingress (HTTPS版本 - 使用默认证书)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docker-hub-proxy-https
  namespace: default
  annotations:
    # 基本代理配置
    # DNS解析器配置
    nginx.ingress.kubernetes.io/configuration-snippet: |
      resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
    
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    
    # 代理头配置
    nginx.ingress.kubernetes.io/proxy-set-headers: "default/docker-hub-headers"
    
    # 使用默认证书 (避免证书错误)
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # 如果使用 cert-manager，取消下面的注释
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
spec:
  ingressClassName: nginx
  rules:
  - host: dockerhub.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: docker-hub-registry
            port:
              number: 443
  # TLS配置 - 使用默认证书或自签名证书
  tls:
  - hosts:
    - dockerhub.yourdomain.com
    # 使用默认的fake证书，避免证书错误
    # secretName: dockerhub-tls-secret  # 注释掉避免错误
---

# 11. 快速测试配置 - 使用默认证书和简单配置
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docker-hub-proxy-simple
  namespace: default
  annotations:
    # 最简单的配置，避免任何证书问题
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-set-headers: "default/docker-hub-headers"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: dockerhub-simple.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: docker-hub-registry
            port:
              number: 443