  - source_labels: [__meta_kubernetes_pod_label_deploy_type]
    separator: ;
    regex: (.*)
    target_label: deploy_type
    replacement: $1
  - source_labels: [__meta_kubernetes_namespace]
    separator: ;
    regex: (.*)
    target_label: namespace
    replacement: $1
    action: replace
  metric_relabel_configs:
  # 通过定义metric_type 用于区分vmstorage
  - source_labels: []
    target_label: metric_type
    replacement: business
    action: replace
