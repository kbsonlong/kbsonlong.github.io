- job_name: kube-state-metrics
  honor_labels: true
  honor_timestamps: true
  scrape_interval: 30s
  scrape_timeout: 30s
  metrics_path: /metrics
  scheme: http
  kubernetes_sd_configs:
  - role: endpoints
    api_server: https://kubernetes.default
    tls_config:
      ca_file: /tmp/ca.pem
      cert_file: /tmp/admin.pem
      key_file: /tmp/admin-key.pem
      insecure_skip_verify: true
    namespaces:
      names:
      - arms-prom
  relabel_configs:
  - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
    separator: ;
    regex: kube-state-metrics
    replacement: $1
    action: keep
  - source_labels: [__meta_kubernetes_endpoint_port_name]
    separator: ;
    regex: http-metrics
    replacement: $1
    action: keep
  - source_labels: [__meta_kubernetes_endpoint_address_target_kind, __meta_kubernetes_endpoint_address_target_name]
    separator: ;
    regex: Node;(.*)
    target_label: node
    replacement: ${1}
    action: replace
  - source_labels: [__meta_kubernetes_endpoint_address_target_kind, __meta_kubernetes_endpoint_address_target_name]
    separator: ;
    regex: Pod;(.*)
    target_label: pod
    replacement: ${1}
    action: replace
  - source_labels: [__meta_kubernetes_namespace]
    separator: ;
    regex: (.*)
    target_label: namespace
    replacement: $1
    action: replace
  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
    separator: ;
    regex: (.*)
    target_label: component
    replacement: $1
    action: replace
  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
    separator: ;
    regex: (.*)
    target_label: mongo_cluster_name
    replacement: $1
    action: replace
  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_replset]
    separator: ;
    regex: (.*)
    target_label: replset
    replacement: $1
    action: replace
  metric_relabel_configs:
  - source_labels: [ label_biz_type ]
    regex: 'yy_train_ai'
    action: drop
  - source_labels: [deployment_name]
    separator: ;
    regex: (.*)
    target_label: deployment_name
    replacement: $1
    action: replace
  - source_labels: [project_name]
    separator: ;
    regex: (.*)
    target_label: project_name
    replacement: $1
    action: replace
  - source_labels: [ project_name, deployment_name ]
    separator: ","
    regex: (.+),(.+)
    target_label: app
    replacement: "$1-$2"
    action: replace
  - source_labels: [op_admin]
    separator: ;
    regex: (.*)
    target_label: op_admin
    replacement: $1
    action: replace
  - source_labels: [deploy_type]
    separator: ;
    regex: (.*)
    target_label: deploy_type
    replacement: $1
    action: replace
  - source_labels: [__name__, exported_pod]
    separator: ;
    regex: kube_pod_info;(.+)
    target_label: pod
    replacement: $1
    action: replace
  - source_labels: [pod]
    separator: ;
    regex: (.*)
    target_label: pod_name
    replacement: $1
    action: replace
  - source_labels: [__name__, exported_namespace]
    separator: ;
    regex: kube_pod_info;(.+)
    target_label: namespace
    replacement: $1
    action: replace
  - source_labels: [__name__, exported_node]
    separator: ;
    regex: kube_pod_info;(.+)
    target_label: node
    replacement: $1
    action: replace
  - separator: ;
    regex: (label_version(.*)|label_CPU_TYPE|label_node_role_kubernetes_io_node_type|label_node_role_kubernetes_io_layout_engine|label_node_role_kubernetes_io_AutoScale|label_ZoneId|label_aws_InstanceType|container_id|image|image_id|instance|configmap|resource_version|uid|label_TESTENV|label_PRODENV|label_CPU_CAP|label_MEM_CAP|label_NIC_CAP|label_PREENV|label_beta_kubernetes_io_arch|label_beta_kubernetes_io_os|label_kubernetes_io_arch|label_kubernetes_io_os|label_node_role_kubernetes_io_CPU_(.*)|label_node_role_kubernetes_io_DISK_(.*)|label_node_role_kubernetes_io_MEM_(.*)|label_node_role_kubernetes_io_NIC_(.*)|label_node_role_kubernetes_io_WorkerNode|label_retention_base_dir|label_ROOM_ID|label_SERVER_ID|label_kubernetes_io_hostname|label_hostname|label_hagonetes_ihago_net_NodeGroup_(.*)|id|label_yyms_aquaman_io(.*)|label_node_role_kubernetes_io_AutoCordon)
    replacement: $1
    action: labeldrop
