# Grafana 路由配置 - 混合认证策略
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: grafana-hybrid-auth
  namespace: monitoring
spec:
  http:
  # 登录相关路径 - 使用 forward-auth 插件
  - name: grafana-login-auth
    match:
      paths:
        - /login
        - /grafana/auth
      hosts:
        - grafana.kbsonlong.com
    backends:
      - serviceName: grafana-service
        servicePort: 3000
        weight: 10
    plugins:
      - name: forward-auth
        enable: true
        config:
          uri: http://sysop.kbsonlong.com/ws/aquaman/grafanaLoginAuth
          request_headers:
            - Authorization
            - Cookie
          client_headers:
            - Location
            - Set-Cookie
          upstream_headers:
            - X-WEBAUTH-USER
            - X-WEBAUTH-NAME
      - name: client-control
        enable: true
        config:
          max_body_size: 50000000

  # API 路径 - 使用 JWT 插件直接验证
  - name: grafana-api-auth
    match:
      paths:
        - /api/*
      hosts:
        - grafana.kbsonlong.com
    backends:
      - serviceName: grafana-service
        servicePort: 3000
        weight: 10
    plugins:
      - name: jwt-auth
        enable: true
        config:
          key: grafana-jwt-key
          secret: mysecretkey
          algorithm: HS256
      - name: proxy-rewrite
        enable: true
        config:
          headers:
            X-WEBAUTH-USER: $jwt_claim_subject
            X-WEBAUTH-NAME: $jwt_claim_name
      - name: client-control
        enable: true
        config:
          max_body_size: 50000000

  # 其他路径 - 使用简化认证（基于 Cookie）
  - name: grafana-main
    match:
      paths:
        - /*
      hosts:
        - grafana.kbsonlong.com
    backends:
      - serviceName: grafana-service
        servicePort: 3000
        weight: 10
    plugins:
      - name: openid-connect
        enable: true
        config:
          client_id: grafana
          client_secret: mysecretkey
          discovery: http://sysop.kbsonlong.com/ws/aquaman/.well-known/openid-configuration
          scope: openid profile email
          bearer_only: true
          realm: grafana
          introspection_endpoint: http://sysop.kbsonlong.com/ws/aquaman/introspect
          introspection_endpoint_auth_method: client_secret_post
      - name: client-control
        enable: true
        config:
          max_body_size: 50000000
    websocket: true