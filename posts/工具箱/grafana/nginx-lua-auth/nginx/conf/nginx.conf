# OpenResty/Nginx 配置文件
# 支持 Lua + JWT 认证的 Grafana 代理

# user nginx;  # 注释掉，使用默认用户
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# 加载动态模块 (OpenResty已内置，无需手动加载)
# load_module modules/ndk_http_module.so;
# load_module modules/ngx_http_lua_module.so;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # 日志格式 - 必须在include conf.d之前定义
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # 基础配置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 客户端配置
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_header_buffer_size 3m;
    large_client_header_buffers 4 256k;

    # 代理配置
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    proxy_buffer_size 64k;
    proxy_buffers 4 64k;
    proxy_busy_buffers_size 128k;
    proxy_temp_file_write_size 128k;
    proxy_temp_path /var/cache/nginx/proxy_temp;

    # Lua 配置
    lua_package_path "/etc/nginx/lua/?.lua;/usr/local/openresty/site/lualib/?.lua;/usr/local/openresty/lualib/?.lua;;";
    lua_code_cache on;
    lua_shared_dict jwt_cache 10m;
    lua_shared_dict user_cache 10m;

    # JWT 配置 (通过环境变量)
    init_by_lua_block {
        -- 全局配置
        _G.JWT_SECRET = os.getenv("JWT_SECRET") or "your-super-secret-jwt-key-change-in-production"
        _G.JWT_EXPIRE = tonumber(os.getenv("JWT_EXPIRE")) or 86400  -- 24小时
        _G.COOKIE_DOMAIN = os.getenv("COOKIE_DOMAIN") or "localhost"
        _G.COOKIE_SECURE = os.getenv("COOKIE_SECURE") == "true"
        
        ngx.log(ngx.INFO, "Lua JWT Auth initialized")
    }

    # 上游服务器定义
    upstream grafana {
        server grafana-server:3000;
        keepalive 32;
    }

    # 限流配置
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # grafana configuration is now integrated into this main config file
    # include /usr/local/openresty/nginx/conf/conf.d/*.conf;

    # 默认服务器（重定向到 HTTPS）
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # 主服务器配置
    server {
        listen 443 ssl http2 default_server;
        server_name localhost grafana.local;

        # SSL 配置
        ssl_certificate /usr/local/openresty/nginx/ssl/server.crt;
        ssl_certificate_key /usr/local/openresty/nginx/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # 安全头
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;

        # 根路径重定向到 Grafana
        location = / {
            return 302 /grafana/;
        }

        # 认证相关路径
        location /auth {
            # 登录页面
            location = /auth/login {
                try_files /dev/null @login_page;
            }

            # 登录 API
            location = /auth/api/login {
                limit_req zone=login burst=3 nodelay;
                
                content_by_lua_block {
                    local login = require "login"
                    login.handle_login()
                }
            }

            # 登出 API
            location = /auth/api/logout {
                content_by_lua_block {
                    local login = require "login"
                    login.handle_logout()
                }
            }

            # 认证状态查询
            location = /auth/api/status {
                limit_req zone=api burst=10 nodelay;
                
                content_by_lua_block {
                    local login = require "login"
                    login.get_user_info()
                }
            }

            # 内部认证端点（用于 auth_request）
            location = /auth/verify {
                internal;
                
                access_by_lua_block {
                    local auth = require "auth"
                    auth.verify_request()
                }
                
                return 200;
            }

            # 健康检查
            location = /auth/health {
                access_log off;
                
                content_by_lua_block {
                    local auth = require "auth"
                    auth.health_check()
                }
            }
        }

        # 静态文件服务
        location /auth/static {
            alias /usr/local/openresty/nginx/html;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # Grafana 代理
        location /grafana/ {
            # 认证检查
            auth_request /auth/verify;
            
            # 传递认证头部
            auth_request_set $auth_user $upstream_http_x_webauth_user;
            auth_request_set $auth_name $upstream_http_x_webauth_name;
            auth_request_set $auth_email $upstream_http_x_webauth_email;
            auth_request_set $auth_role $upstream_http_x_webauth_role;
            
            # 认证失败处理
            error_page 401 = @auth_required;
            error_page 403 = @access_denied;

            # 代理到 Grafana
            proxy_pass http://grafana/;
            
            # 基础代理头部
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            
            # Grafana 认证头部
            proxy_set_header X-WEBAUTH-USER $auth_user;
            proxy_set_header X-WEBAUTH-NAME $auth_name;
            proxy_set_header X-WEBAUTH-EMAIL $auth_email;
            proxy_set_header X-WEBAUTH-ROLE $auth_role;
            
            # WebSocket 支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 缓存控制
            proxy_cache_bypass $http_upgrade;
            proxy_no_cache $http_upgrade;
        }

        # API 路径（需要认证）
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            auth_request /auth/verify;
            auth_request_set $auth_user $upstream_http_x_webauth_user;
            
            error_page 401 = @auth_required;
            error_page 403 = @access_denied;

            proxy_pass http://grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-WEBAUTH-USER $auth_user;
        }

        # 错误页面处理
        location @login_page {
            content_by_lua_block {
                local login = require "login"
                login.show_login_page()
            }
        }

        location @auth_required {
            internal;
            
            # 获取原始请求 URI
            set $original_uri $request_uri;
            if ($request_uri ~ "^/grafana(.*)$") {
                set $original_uri $1;
            }
            
            return 302 /auth/login?redirect=$scheme://$host/grafana$original_uri;
        }

        location @access_denied {
            internal;
            
            content_by_lua_block {
                ngx.status = 403
                ngx.header["Content-Type"] = "text/html; charset=utf-8"
                
                local file = io.open("/usr/local/openresty/nginx/html/error.html", "r")
                if file then
                    local content = file:read("*all")
                    file:close()
                    ngx.say(content)
                else
                    ngx.say("<h1>403 Forbidden</h1><p>Access denied.</p>")
                end
            }
        }

        # 默认错误页面
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            root /usr/local/openresty/nginx/html;
            internal;
        }
        
        location = /50x.html {
            root /usr/local/openresty/nginx/html;
            internal;
        }

        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # 禁止访问备份文件
        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # HTTP 服务器（开发环境）
    server {
        listen 8080;
        server_name localhost;

        # 根路径重定向
        location = / {
            return 302 /grafana/;
        }

        # 认证路径（与 HTTPS 相同）
        location /auth {
            location = /auth/login {
                try_files /dev/null @login_page;
            }

            location = /auth/api/login {
                limit_req zone=login burst=3 nodelay;
                content_by_lua_block {
                    local login = require "login"
                    login.handle_login()
                }
            }

            location = /auth/api/logout {
                content_by_lua_block {
                    local login = require "login"
                    login.handle_logout()
                }
            }

            location = /auth/api/status {
                limit_req zone=api burst=10 nodelay;
                content_by_lua_block {
                    local login = require "login"
                    login.get_user_info()
                }
            }

            location = /auth/verify {
                internal;
                access_by_lua_block {
                    local auth = require "auth"
                    auth.verify_request()
                }
                return 200;
            }

            location = /auth/health {
                access_log off;
                content_by_lua_block {
                    local auth = require "auth"
                    auth.health_check()
                }
            }
        }

        # Grafana 代理（HTTP 版本）
        location /grafana/ {
            auth_request /auth/verify;
            
            auth_request_set $auth_user $upstream_http_x_webauth_user;
            auth_request_set $auth_name $upstream_http_x_webauth_name;
            auth_request_set $auth_email $upstream_http_x_webauth_email;
            auth_request_set $auth_role $upstream_http_x_webauth_role;
            
            error_page 401 = @auth_required_http;
            error_page 403 = @access_denied;

            proxy_pass http://grafana/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-WEBAUTH-USER $auth_user;
            proxy_set_header X-WEBAUTH-NAME $auth_name;
            proxy_set_header X-WEBAUTH-EMAIL $auth_email;
            proxy_set_header X-WEBAUTH-ROLE $auth_role;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location @auth_required_http {
            internal;
            set $original_uri $request_uri;
            if ($request_uri ~ "^/grafana(.*)$") {
                set $original_uri $1;
            }
            return 302 /auth/login?redirect=$scheme://$host:$server_port/grafana$original_uri;
        }

        # 其他位置块与 HTTPS 版本相同
        location @login_page {
            content_by_lua_block {
                local login = require "login"
                login.show_login_page()
            }
        }

        location @access_denied {
            internal;
            content_by_lua_block {
                ngx.status = 403
                ngx.header["Content-Type"] = "text/html; charset=utf-8"
                local file = io.open("/etc/nginx/html/error.html", "r")
                if file then
                    local content = file:read("*all")
                    file:close()
                    ngx.say(content)
                else
                    ngx.say("<h1>403 Forbidden</h1><p>Access denied.</p>")
                end
            }
        }
    }
}