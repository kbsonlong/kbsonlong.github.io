# Grafana 代理认证配置
# 此文件包含 Grafana 特定的代理设置和认证规则

# Grafana 上游服务器配置
upstream grafana_backend {
    server grafana:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Grafana 服务器配置块
server {
    listen 3001;
    server_name grafana.local localhost;

    # 日志配置
    access_log /var/log/nginx/grafana_access.log main;
    error_log /var/log/nginx/grafana_error.log warn;

    # 客户端配置
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # 根路径处理
    location = / {
        return 302 /grafana/;
    }

    # Grafana 主路径
    location /grafana/ {
        # 认证检查
        auth_request /auth/verify;
        
        # 从认证服务获取用户信息
        auth_request_set $auth_user $upstream_http_x_webauth_user;
        auth_request_set $auth_name $upstream_http_x_webauth_name;
        auth_request_set $auth_email $upstream_http_x_webauth_email;
        auth_request_set $auth_role $upstream_http_x_webauth_role;
        auth_request_set $auth_groups $upstream_http_x_webauth_groups;
        
        # 认证失败处理
        error_page 401 = @grafana_auth_required;
        error_page 403 = @grafana_access_denied;
        
        # 代理到 Grafana
        proxy_pass http://grafana_backend/;
        
        # 基础代理头部
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Grafana 代理认证头部
        proxy_set_header X-WEBAUTH-USER $auth_user;
        proxy_set_header X-WEBAUTH-NAME $auth_name;
        proxy_set_header X-WEBAUTH-EMAIL $auth_email;
        proxy_set_header X-WEBAUTH-ROLE $auth_role;
        proxy_set_header X-WEBAUTH-GROUPS $auth_groups;
        
        # 移除可能的认证头部（安全考虑）
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        
        # WebSocket 支持（Grafana Live）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # 缓存控制
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;
        
        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Grafana API 路径
    location /api/ {
        # 认证检查
        auth_request /auth/verify;
        
        # 获取用户信息
        auth_request_set $auth_user $upstream_http_x_webauth_user;
        auth_request_set $auth_role $upstream_http_x_webauth_role;
        
        # 认证失败处理
        error_page 401 = @grafana_auth_required;
        error_page 403 = @grafana_access_denied;
        
        # 限流（API 调用）
        limit_req zone=api burst=50 nodelay;
        
        # 代理到 Grafana API
        proxy_pass http://grafana_backend;
        
        # API 专用头部
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-WEBAUTH-USER $auth_user;
        proxy_set_header X-WEBAUTH-ROLE $auth_role;
        
        # API 超时配置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Grafana 公共资源（无需认证）
    location /public/ {
        proxy_pass http://grafana_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 缓存静态资源
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Grafana 健康检查（无需认证）
    location /api/health {
        proxy_pass http://grafana_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # Grafana 指标端点（需要管理员权限）
    location /metrics {
        # 认证检查
        auth_request /auth/verify;
        
        # 获取用户角色
        auth_request_set $auth_role $upstream_http_x_webauth_role;
        
        # 只允许管理员访问
        access_by_lua_block {
            local role = ngx.var.auth_role
            if role ~= "admin" and role ~= "editor" then
                ngx.status = 403
                ngx.say("Access denied: Admin role required")
                ngx.exit(403)
            end
        }
        
        proxy_pass http://grafana_backend;
        proxy_set_header Host $host;
        proxy_set_header X-WEBAUTH-ROLE $auth_role;
    }

    # 认证端点（内部使用）
    location = /auth/verify {
        internal;
        
        # 调用认证服务
        access_by_lua_block {
            local auth = require "auth"
            auth.verify_request()
        }
        
        return 200;
    }

    # 错误页面处理
    location @grafana_auth_required {
        internal;
        
        # 构建重定向 URL
        set $redirect_uri $request_uri;
        if ($request_uri ~ "^/grafana(.*)$") {
            set $redirect_uri $1;
        }
        
        # 重定向到登录页面
        return 302 /auth/login?redirect=$scheme://$host:$server_port/grafana$redirect_uri;
    }

    location @grafana_access_denied {
        internal;
        
        content_by_lua_block {
            ngx.status = 403
            ngx.header["Content-Type"] = "application/json; charset=utf-8"
            
            local response = {
                error = "Access Denied",
                message = "You don't have permission to access this resource",
                code = 403,
                timestamp = ngx.time()
            }
            
            local cjson = require "cjson"
            ngx.say(cjson.encode(response))
        }
    }

    # 静态文件缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://grafana_backend;
        proxy_set_header Host $host;
        
        # 长期缓存
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        
        # 压缩
        gzip_static on;
    }

    # 禁止访问敏感文件
    location ~ /\.(ht|git|svn) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止访问配置文件
    location ~ \.(conf|ini|log|bak|old|tmp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# WebSocket 连接升级映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 限流区域定义（如果在主配置中未定义）
# limit_req_zone $binary_remote_addr zone=grafana_api:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=grafana_login:10m rate=5r/m;

# 日志格式（如果需要特殊格式）
log_format grafana_format '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'auth_user="$auth_user" auth_role="$auth_role" '
                         'rt=$request_time uct="$upstream_connect_time" '
                         'uht="$upstream_header_time" urt="$upstream_response_time"';