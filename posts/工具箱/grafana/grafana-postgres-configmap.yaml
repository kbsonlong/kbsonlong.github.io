apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  labels:
    app: grafana
data:
  grafana.ini: |
    [paths]
    data = /var/lib/grafana
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning

    [server]
    protocol = http
    http_port = 3000
    domain = localhost
    root_url = %(protocol)s://%(domain)s:%(http_port)s/
    serve_from_sub_path = false

    [database]
    type = postgres
    host = postgres-service:5432
    name = grafana
    user = grafana
    password = ${GF_DATABASE_PASSWORD}
    ssl_mode = disable
    # 连接池设置
    max_idle_conn = 10
    max_open_conn = 100
    conn_max_lifetime = 14400

    [security]
    # 管理员账户设置
    admin_user = admin
    admin_password = ${GF_SECURITY_ADMIN_PASSWORD}
    # 禁用初始化管理员重置
    disable_initial_admin_creation = false
    # 密码策略
    disable_brute_force_login_protection = false

    [users]
    # 允许用户注册
    allow_sign_up = false
    # 允许组织管理员创建用户
    allow_org_admin_create_users = true

    [auth]
    # 禁用登录表单
    disable_login_form = false
    # 禁用匿名访问
    disable_signout_menu = false

    [auth.anonymous]
    # 启用匿名访问
    enabled = false

    [analytics]
    # 检查更新
    check_for_updates = true
    # 报告使用统计
    reporting_enabled = false

    [dashboards]
    # 仪表板版本历史
    versions_to_keep = 20

    [unified_alerting]
    # 启用统一告警
    enabled = true

    [alerting]
    # 禁用旧版告警
    enabled = false

    [log]
    # 日志级别
    level = info
    # 日志模式
    mode = console

    [metrics]
    # 启用内部指标
    enabled = true
    # 禁用基本认证
    basic_auth_enabled = false

    [tracing.jaeger]
    # 禁用Jaeger跟踪
    enabled = false

    [feature_toggles]
    # 启用特性开关
    enable = publicDashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus-service:9090
      access: proxy
      isDefault: true
    - name: PostgreSQL
      type: postgres
      url: postgres-service:5432
      database: postgres
      user: grafana
      secureJsonData:
        password: ${GF_DATABASE_PASSWORD}
      jsonData:
        sslmode: "disable"
        maxOpenConns: 100
        maxIdleConns: 10
        connMaxLifetime: 14400
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    app: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  labels:
    app: postgres
data:
  init-grafana-db.sh: |
    #!/bin/bash
    set -e

    echo "正在为Grafana创建数据库角色和权限..."

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        -- 创建grafana角色（如果不存在）
        DO \$\$ 
        BEGIN
            IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'grafana') THEN
                CREATE ROLE grafana WITH LOGIN PASSWORD '$GRAFANA_DB_PASSWORD';
            END IF;
        END
        \$\$;

        -- 授予grafana角色对grafana数据库的所有权限
        GRANT ALL PRIVILEGES ON DATABASE grafana TO grafana;
        
        -- 连接到grafana数据库以设置schema权限
        \c grafana
        
        -- 授予grafana角色对public schema的所有权限
        GRANT ALL PRIVILEGES ON SCHEMA public TO grafana;
        
        -- 设置默认权限，使grafana角色成为未来创建的表的所有者
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO grafana;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO grafana;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON FUNCTIONS TO grafana;
    EOSQL

    echo "Grafana数据库角色和权限设置完成！"