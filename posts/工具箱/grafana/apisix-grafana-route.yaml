# Grafana 路由配置 - 使用 JWT 插件直接验证 token
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: grafana-jwt
  namespace: monitoring
spec:
  http:
  # 所有 Grafana 路由 - 使用 JWT 插件验证 token
  - name: grafana-jwt
    match:
      paths:
        - /*
      hosts:
        - grafana.kbsonlong.com
    backends:
      - serviceName: grafana-service
        servicePort: 3000
        weight: 10
    plugins:
      - name: jwt-auth
        enable: true
        config:
          key: grafana-jwt-key
          secret: mysecretkey
          algorithm: HS256
      - name: proxy-rewrite
        enable: true
        config:
          headers:
            X-WEBAUTH-USER: $jwt_claim_subject
            X-WEBAUTH-NAME: $jwt_claim_name
      - name: client-control
        enable: true
        config:
          max_body_size: 50000000
    websocket: true
---
apiVersion: apisix.apache.org/v2
kind: ApisixConsumer
metadata:
  name: grafana-user
  namespace: monitoring
spec:
  authParameter:
    jwtAuth:
      secretRef:
        name: grafana-jwt-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-jwt-secret
  namespace: monitoring
type: Opaque
data:
  key: Z3JhZmFuYS1qd3Qta2V5
  secret: bXlzZWNyZXRrZXk=