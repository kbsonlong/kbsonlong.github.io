map $http_authorization $jwt_token {
    ~Bearer(.*) $1;
    default "";
}

server {
    listen 80;
    server_name localhost 127.0.0.1;

    # 主要的 Grafana 路由
    location /grafana/ {
        # 发送到认证服务进行验证
        auth_request /auth;
        
        # 从认证服务获取用户信息
        auth_request_set $auth_user $upstream_http_x_auth_user;
        auth_request_set $auth_name $upstream_http_x_auth_name;
        
        # 设置 Grafana 需要的头部
        proxy_set_header X-WEBAUTH-USER $auth_user;
        proxy_set_header X-WEBAUTH-NAME $auth_name;
        
        # 其他必要头部
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 代理到 Grafana
        proxy_pass http://grafana:3000;
        # 移除proxy_redirect以避免cookie路径被重写
    }
    
    # Grafana 认证端点
    location /grafana/auth {
        proxy_pass http://auth-service:8080;
        # 修复cookie路径问题 - 将/grafana/路径重写为根路径/
        proxy_cookie_path /grafana/ /;
    }
    
    # 认证端点
    location = /auth {
        internal;
        
        # 启用详细日志
        access_log /var/log/nginx/auth_access.log main;
        error_log /var/log/nginx/auth_error.log debug;
        
        # 确保 cookie 被传递到认证服务
        proxy_pass http://auth-service:8080/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-JWT-Token $jwt_token;
        # 确保 cookie 被正确传递
        proxy_set_header Cookie $http_cookie;
        # 传递Host头
        proxy_set_header Host $host;
        # 传递真实IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    # 登录端点 - 用于获取 JWT token
    location /login {
        proxy_pass http://auth-service:8080/login;
    }
    
    # 前端登录页面
    location / {
        proxy_pass http://auth-service:8080/;
    }
    
    # 健康检查
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}